<!DOCTYPE html>
<html>

<body>
    <script>
        let s1 = Number(prompt("Enter Side 1:"));
        let s2 = Number(prompt("Enter Side 2:"));
        let s3 = Number(prompt("Enter Side 3:"));

        if (s1 === s2 && s2 === s3) {
            document.write("Equilateral triangle.");
        }
        else if (s1 === s2 || s2 === s3 || s1 === s3) {
            document.write("Isosceles triangle.");
        }
        else {
            document.write("Scalene triangle.");
        }
    </script>
</body>

</html>
