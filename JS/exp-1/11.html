<!DOCTYPE html>
<html>

<body>
    <script>
        let n1 = prompt("Enter first number")
        let n2 = prompt("Enter second number")
        let n3 = prompt("Enter third number")

        if (n1 > n2 && n1 > n3) {
            document.write(n1 + " is greatest.")
        } else if (n2 > n1 && n2 > n3) {
            document.write(n2 + " is greatest.")
        } else {
            document.write(n3 + " is greatest.")
        }
    </script>
</body>

</html>
