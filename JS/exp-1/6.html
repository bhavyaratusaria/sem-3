<!DOCTYPE html>
<html>

<body>
    <script>
        let c = prompt("Enter degree celsius")
        let f = prompt("Enter degree fahrenheit")
        let c_f = (c * 9 / 5) + 32
        let f_c = (f - 32) * (5 / 9)
        document.write("Celsius to Fahrenheit = " + c_f + "<br>")
        document.write("Fahrenheit to Celsius = " + f_c + "<br>")

    </script>
</body>

</html>
