<!DOCTYPE html>
<html>

<body>
    <script>
        let PI = 3.1415
        let r = prompt("Enter radius for circle")
        let s = prompt("Enter side for square")
        let l = prompt("Enter length for rectangle")
        let w = prompt("Enter width for rectangle")
        let circle = Number(PI) * Number(r) * Number(r)
        let square = Number(s) * Number(s)
        let rectangle = Number(l) * Number(w)
        document.write("Area of circle is " + circle + "<br>")
        document.write("Area of square is " + square + "<br>")
        document.write("Area of rectangle is " + rectangle + "<br>")
    </script>
</body>

</html>
