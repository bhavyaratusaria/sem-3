<!DOCTYPE html>
<html>

<body>
    <script>
        let score = prompt("Enter student score")
        let grade

        if (score >= 90) {
            grade = "A+"
        } else if (score >= 80) {
            grade = "A"
        } else if (score >= 70) {
            grade = "B"
        } else if (score >= 60) {
            grade = "C"
        } else {
            grade = "F"
        }

        document.write("Grade = " + grade)
    </script>
</body>

</html>
